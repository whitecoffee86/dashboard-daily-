name: Update Dashboard Data

on:
  push:
    paths:
      - '_단기투자_INPUT.xlsx'   # 엑셀 파일 push 시 자동 실행
  workflow_dispatch:          # 수동 실행 버튼도 제공

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write         # JSON 파일 커밋 권한

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas openpyxl

      - name: Run update script
        run: python scripts/update_data.py

      - name: Commit & Push JSON files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/daily.json data/accounts.json data/monthly.json
          git diff --staged --quiet || git commit -m "🤖 데이터 자동 업데이트 $(date +'%Y-%m-%d')"
          git push
